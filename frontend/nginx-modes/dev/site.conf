# MODE=dev: every request needs the dev access cookie, checked by the
# backend. Without it the visitor gets the login page, which sends them back
# to the page they asked for.
auth_request /_dev_access;
error_page 401 = @dev_login;

location = /_dev_access {
  internal;
  auth_request off;
  proxy_pass http://backend:8000/api/dev-access/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
}

location @dev_login {
  auth_request off;
  include /etc/nginx/conf.d/security-headers.conf;
  rewrite ^ /api/dev-access/login break;
  proxy_method GET;
  proxy_pass http://backend:8000;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
