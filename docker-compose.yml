

# Container logs hold IP addresses and user agents (personal data), so every
# service keeps at most 5 files of 10 MB, the oldest overwritten first.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    logging: *logging
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_BUSINESS_LEGAL_NAME: ${VITE_BUSINESS_LEGAL_NAME}
        VITE_BUSINESS_TAX_ID: ${VITE_BUSINESS_TAX_ID}
        VITE_BUSINESS_TRADE_REGISTER_NO: ${VITE_BUSINESS_TRADE_REGISTER_NO}
        VITE_SITE_MODE: ${MODE}
    ports:
      - "80:8080"   # HTTP port for redirect to HTTPS
      - "443:8443"  # HTTPS port
    networks:
      - react-rust
      - grafana-web
    env_file:
      - .env
    volumes:
      - 'miedaria_paunilor_images:/app/images'
      - './ssl:/etc/nginx/ssl:ro'  # Mount SSL certificates
      - './acme:/var/www/acme:ro'  # Let's Encrypt challenges (scripts/server_setup.sh)
    depends_on:
      backend:
        condition: service_started
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    logging: *logging
    build: ./backend
    networks:
      react-rust:
      rust-postgres:
      monitoring:
        # Fixed so the metrics listener can bind to this interface only
        # (METRICS_ADDR in .env).
        ipv4_address: 172.31.99.10
    env_file:
      - .env
    volumes:
      - 'miedaria_paunilor_images:/app/images'
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      # The runtime image has no HTTP client; bash's /dev/tcp sends the
      # request instead, so none has to be installed.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${BACKEND_PORT} && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r _ status _ <&3 && [ \"$$status\" = 200 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  database:
    logging: *logging
    image: postgres:16.2-alpine
    networks:
      - rust-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Scrapes the backend's internal metrics port; not reachable from outside
  # the monitoring network. Keeps two years of history for year-over-year
  # sales comparisons.
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y
    networks:
      - monitoring
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Dashboards and alerts, served by nginx under /grafana/. Data source,
  # dashboard and alert rules are provisioned read-only from ./monitoring.
  grafana:
    logging: *logging
    image: grafana/grafana:13.2.2
    networks:
      - monitoring
      - grafana-web
    environment:
      GF_SERVER_ROOT_URL: ${ALLOWED_ORIGIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "63072000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Bucharest
      # Alert emails go through the same relay as the newsletter.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}:${SMTP_PORT}
      GF_SMTP_USER: ${SMTP_USERNAME}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME} monitoring
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Local mail catcher for development only; never started in production.
  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.31.3
    profiles: ["mail-dev"]
    networks:
      - react-rust
      - grafana-web
    ports:
      - "127.0.0.1:8025:8025"  # Web UI with the captured mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  react-rust:
  rust-postgres:
  # backend metrics port, Prometheus and Grafana; the frontend is not on it.
  monitoring:
    internal: true
    ipam:
      config:
        - subnet: 172.31.99.0/24
  # nginx to Grafana, plus Grafana's outbound access to the SMTP relay.
  grafana-web:

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  miedaria_paunilor_images:
