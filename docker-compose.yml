

# Container logs hold IP addresses and user agents (personal data), so every
# service keeps at most 5 files of 10 MB, the oldest overwritten first.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    logging: *logging
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_BUSINESS_LEGAL_NAME: ${VITE_BUSINESS_LEGAL_NAME}
        VITE_BUSINESS_TAX_ID: ${VITE_BUSINESS_TAX_ID}
        VITE_BUSINESS_TRADE_REGISTER_NO: ${VITE_BUSINESS_TRADE_REGISTER_NO}
    ports:
      - "80:8080"   # HTTP port for redirect to HTTPS
      - "443:8443"  # HTTPS port
    networks:
      - react-rust
    env_file:
      - .env
    volumes:
      - 'miedaria_paunilor_images:/app/images'
      - './ssl:/etc/nginx/ssl:ro'  # Mount SSL certificates
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    logging: *logging
    build: ./backend
    networks:
      - react-rust
      - rust-postgres
    env_file:
      - .env
    volumes:
      - 'miedaria_paunilor_images:/app/images'
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  database:
    logging: *logging
    image: postgres:16.2-alpine
    networks:
      - rust-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local mail catcher for development only; never started in production.
  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.31.3
    profiles: ["mail-dev"]
    networks:
      - react-rust
    ports:
      - "127.0.0.1:8025:8025"  # Web UI with the captured mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  react-rust:
  rust-postgres:

volumes:
  postgres-data:
  miedaria_paunilor_images:
